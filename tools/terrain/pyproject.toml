[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replica"
version = "0.1.0"
description = "Offline pipeline: real coordinate -> data for a Godot terrain replica"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["replica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "site: needs the real cached DEM/imagery under data/sites/<site>/cache (skipped when missing)",
]
